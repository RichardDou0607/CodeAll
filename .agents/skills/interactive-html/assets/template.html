<body>
<a class="skip" href="#content">跳到主要内容</a>
<header class="topbar">
  <a class="brand" href="#" id="home-link"><span class="brand-mark">&lt;/&gt;</span><span><span class="brand-name" id="brand-name">Project</span><span class="brand-sub">INTERACTIVE OBSERVATORY</span></span></a>
  <span class="top-spacer"></span><span class="snapshot" id="snapshot"></span>
  <button class="btn" id="search-open" aria-label="搜索页面数据">⌕ <span>搜索</span> <kbd class="key">⌘K</kbd></button>
  <button class="icon-btn" id="theme-toggle" aria-label="切换深浅色主题" title="切换深浅色主题">◐</button>
</header>
<div class="shell">
  <aside class="sidebar"><div><div class="side-label">VIEWS / 视图</div><nav class="side-nav" id="view-nav" aria-label="页面视图导航"></nav></div><div class="side-meta" id="side-meta"></div></aside>
  <main class="main" id="content" tabindex="-1">
    <div class="page-intro"><div class="eyebrow" id="page-eyebrow">PROJECT OBSERVATORY</div><h1 id="page-title">交互观测台</h1><p class="page-description" id="page-description"></p></div>
    <section class="stats" id="stats" aria-label="项目概况"></section>
    <div id="views"></div>
    <footer class="footer" id="footer"></footer>
  </main>
</div>
<dialog class="dialog" id="search-dialog" aria-labelledby="search-title">
  <h2 class="sr-only" id="search-title">搜索页面数据</h2>
  <div class="dialog-head"><span aria-hidden="true">⌕</span><label class="sr-only" for="search-input">搜索模块、指标、版本或任务</label><input id="search-input" type="search" placeholder="搜索模块、指标、版本或任务…" autocomplete="off"><button class="icon-btn" id="search-close" aria-label="关闭搜索">×</button></div>
  <div class="search-results" id="search-results"></div>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><div style="padding:20px;text-align:center">请启用 JavaScript 以使用视图切换、筛选和搜索。</div></noscript>
<script>
const DATA=/*__PROJECT_DATA__*/;
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const meta=DATA.meta;
const state={view:DATA.views[0].id,selected:{},taskFilter:'all'};
const TASK_LABELS={done:'已完成',in_progress:'进行中',blocked:'阻塞',pending:'待启动'};
const TASK_TONES={done:'done',in_progress:'in_progress',blocked:'blocked',pending:'pending'};
document.documentElement.dataset.accent=meta.accent||'lime';
function tone(status){
  const value=String(status||'').toLowerCase();
  if(/阻塞|blocked/.test(value))return 'blocked';
  if(/进行|开发|实验|in_progress/.test(value))return 'in_progress';
  if(/待启动|待办|规划|pending/.test(value))return 'pending';
  if(/完成|发布|稳定|done/.test(value))return 'done';
  return 'pending';
}
function badge(status,label){return status?`<span class="status ${TASK_TONES[status]||tone(status)}">${esc(label||TASK_LABELS[status]||status)}</span>`:''}
function itemKey(view,index){return `${view.id}-${index}`}
function viewHead(view,extra=''){return `<div class="view-head"><div><h2>${esc(view.title)}</h2><p>${esc(view.description||'')}</p></div>${extra}</div>`}
function list(values,cls=''){return Array.isArray(values)&&values.length?`<ul class="${cls}">${values.map(value=>`<li>${esc(value)}</li>`).join('')}</ul>`:''}
function valueText(value){if(Array.isArray(value))return value.join('、');if(typeof value==='boolean')return value?'是':'否';if(value&&typeof value==='object')return JSON.stringify(value);return String(value??'—')}
function renderNav(){
  $('view-nav').innerHTML=DATA.views.map((view,index)=>`<a class="side-link" href="#${view.id}" data-view="${view.id}" aria-current="${state.view===view.id?'page':'false'}"><span>${esc(view.label)}</span><small class="side-index">${String(index+1).padStart(2,'0')}</small></a>`).join('');
}
function renderSummary(){
  const items=Array.isArray(DATA.summary)?DATA.summary:[];
  $('stats').hidden=!items.length;
  $('stats').innerHTML=items.map(item=>`<div class="stat" data-tone="${esc(item.tone||'accent')}"><div class="stat-label">${esc(item.label)}</div><div class="stat-value">${esc(item.value)}</div><div class="stat-note">${esc(item.note||'')}</div></div>`).join('');
}
function renderCards(view){
  return viewHead(view)+`<div class="card-grid">${view.items.map((item,index)=>`<article class="card" data-key="${itemKey(view,index)}"><div class="card-top"><div><h3>${esc(item.title)}</h3><div class="card-subtitle">${esc(item.subtitle||'')}</div></div>${badge(item.status)}</div><p class="card-description">${esc(item.description||'')}</p><div class="tags">${(item.tags||[]).map(tag=>`<span class="tag">${esc(tag)}</span>`).join('')}</div>${item.path?`<button class="path" data-copy="${esc(item.path)}" aria-label="复制路径 ${esc(item.path)}">${esc(item.path)}</button>`:''}${item.fields?`<dl class="fields">${item.fields.map(field=>`<dt>${esc(field.label)}</dt><dd>${esc(field.value)}</dd>`).join('')}</dl>`:''}${item.facts?`<details><summary>职责与详情</summary>${list(item.facts)}</details>`:''}</article>`).join('')}</div>`;
}
function number(value,format){
  if(format==='bytes'){if(value===0)return '0 B';if(value>=1e6)return (value/1e6).toFixed(value>=1e7?1:2)+' MB';if(value>=1e3)return (value/1e3).toFixed(1)+' KB';return value+' B'}
  return Number(value).toLocaleString('zh-CN');
}
function renderMetrics(view){
  return viewHead(view)+`<div class="metric-grid">${view.items.map((item,index)=>{const width=item.before?Math.min(100,item.after/item.before*100):(item.after?100:0);return `<article class="metric" data-key="${itemKey(view,index)}"><div class="metric-top"><span class="metric-name">${esc(item.name)}</span>${item.delta?`<span class="delta">${esc(item.delta)}</span>`:''}</div><div class="metric-values"><span class="metric-after">${number(item.after,item.format)}</span><span class="metric-unit">${esc(item.unit||'')}</span><span class="metric-before">${number(item.before,item.format)}</span></div><div class="bar-row"><span>之前</span><div class="bar-track"><div class="bar-fill" style="width:100%"></div></div></div><div class="bar-row after"><span>之后</span><div class="bar-track"><div class="bar-fill" style="width:${width}%"></div></div></div>${item.note?`<div class="metric-note">${esc(item.note)}</div>`:''}</article>`}).join('')}</div>`;
}
function renderTimeline(view){
  let selected=Number.isInteger(state.selected[view.id])?state.selected[view.id]:0;
  if(selected<0||selected>=view.items.length)selected=0;
  state.selected[view.id]=selected;
  const item=view.items[selected];
  const timeline=`<div class="timeline-list panel">${view.items.map((entry,index)=>`<button class="timeline-item ${index===selected?'selected':''}" data-timeline-index="${index}" aria-pressed="${index===selected}"><span class="timeline-dot"></span><span><span class="timeline-title">${esc(entry.title)}</span><span class="timeline-date">${esc(entry.date||'')}</span></span></button>`).join('')}</div>`;
  const detail=`<article class="timeline-detail panel" data-key="${itemKey(view,selected)}"><div class="detail-head"><div><h3>${esc(item.title)}</h3>${item.previous?`<span class="detail-previous">相比上一版 · ${esc(item.previous)}</span>`:''}</div>${badge(item.status)}</div><p class="detail-summary">${esc(item.summary||'')}</p>${item.upgrades?`<div class="upgrade-box"><h4>相比上一版的提升</h4>${list(item.upgrades)}</div>`:''}<div class="boundary-grid"><section class="boundary-col"><h4>能做什么</h4>${list(item.can,'boundary-list')}</section><section class="boundary-col limit"><h4>不能做 / 不承诺</h4>${list(item.cannot,'boundary-list')}</section></div>${item.note?`<div class="boundary-note">${esc(item.note)}</div>`:''}</article>`;
  return viewHead(view)+`<div class="timeline-layout">${timeline}${detail}</div>`;
}
function renderTasks(view){
  const done=view.items.filter(item=>item.status==='done').length;
  const total=view.items.length;
  const visible=view.items.map((item,index)=>({item,index})).filter(({item})=>state.taskFilter==='all'||(state.taskFilter==='done'?item.status==='done':item.status!=='done'));
  const summary=`<div class="task-summary"><div class="score-card panel"><span class="score-label">任务项完成度</span><div class="score-value">${done}<small> / ${total}</small></div><progress max="${total}" value="${done}" aria-label="任务项完成度：${done} / ${total}"></progress><div class="score-note">仅按任务项计数，不代表代码量或整体工作量百分比</div></div><div class="blockers">${(view.blockers||[]).map(item=>`<article class="blocker"><h4>${esc(item.title)}</h4><p>${esc(item.detail||'')}</p></article>`).join('')||'<article class="blocker"><h4>当前无已登记阻塞</h4><p>以最新任务快照为准。</p></article>'}</div></div>`;
  const filter=`<div class="segment" id="task-filter" aria-label="任务状态筛选"><button data-task-filter="all" aria-pressed="${state.taskFilter==='all'}">全部</button><button data-task-filter="open" aria-pressed="${state.taskFilter==='open'}">未完成</button><button data-task-filter="done" aria-pressed="${state.taskFilter==='done'}">已完成</button></div>`;
  const tasks=`<div class="panel"><div class="panel-head"><div><h3>任务清单</h3></div>${filter}</div><ol class="task-list">${visible.map(({item,index})=>`<li class="task-item" data-key="${itemKey(view,index)}" data-status="${item.status}"><div><h4>${esc(item.title)}</h4><p>${esc(item.summary||'')}</p>${item.remaining?`<p class="task-remaining">剩余：${esc(item.remaining)}</p>`:''}${item.evidence?`<span class="task-evidence">${esc(item.evidence)}</span>`:''}</div>${badge(item.status)}</li>`).join('')||'<li class="empty">此筛选下暂无任务</li>'}</ol></div>`;
  const next=`<div class="panel"><div class="panel-head"><div><h3>下一步</h3></div></div><ol class="next-list">${(view.next||[]).map(item=>`<li class="next-item"><h4>${esc(item.title)}</h4><p>${esc(item.detail||'')}</p></li>`).join('')||'<li class="next-item"><h4>待补充下一步</h4><p>根据最新任务状态决定。</p></li>'}</ol></div>`;
  return viewHead(view)+summary+`<div class="task-layout">${tasks}${next}</div>`;
}
function renderTable(view){
  const columns=view.columns;
  const table=`<div class="panel"><div class="panel-body table-wrap" tabindex="0" role="region" aria-label="${esc(view.title)}"><table class="responsive-table"><caption>${esc(view.caption||view.description||'')}</caption><thead><tr>${columns.map(column=>`<th scope="col">${esc(column.label)}</th>`).join('')}</tr></thead><tbody>${view.items.map((item,index)=>`<tr data-key="${itemKey(view,index)}">${columns.map((column,columnIndex)=>columnIndex===0?`<th scope="row">${esc(valueText(item[column.key]))}</th>`:`<td data-label="${esc(column.label)}">${esc(valueText(item[column.key]))}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
  return viewHead(view)+table;
}
function updateHash(){
  const view=DATA.views.find(item=>item.id===state.view);
  const selected=state.selected[state.view];
  const suffix=Number.isInteger(selected)&&view.items[selected]?.id?'/'+view.items[selected].id:'';
  history.replaceState(null,'','#'+state.view+suffix);
}
function renderView(){
  const view=DATA.views.find(item=>item.id===state.view)||DATA.views[0];
  state.view=view.id;
  renderNav();
  $('views').innerHTML=view.type==='cards'?renderCards(view):view.type==='metrics'?renderMetrics(view):view.type==='timeline'?renderTimeline(view):view.type==='tasks'?renderTasks(view):renderTable(view);
  document.title=view.label+' · '+meta.project;
  updateHash();
}
function navigate(viewId,itemIndex,scroll=true){
  if(!DATA.views.some(view=>view.id===viewId))return;
  state.view=viewId;
  if(Number.isInteger(itemIndex))state.selected[viewId]=itemIndex;
  renderView();
  if(scroll)window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
}
const SEARCH_INDEX=DATA.views.flatMap(view=>view.items.map((item,index)=>({viewId:view.id,viewLabel:view.label,index,title:item.title||item.name||valueText(item[view.columns?.[0]?.key])||view.title,sub:item.summary||item.description||item.remaining||item.note||'',text:JSON.stringify(item)})));
let searchVisible=[];
function renderSearch(){
  const query=$('search-input').value.trim().toLowerCase();
  searchVisible=(query?SEARCH_INDEX.filter(item=>(item.title+' '+item.sub+' '+item.text).toLowerCase().includes(query)):SEARCH_INDEX.slice(0,8)).slice(0,12);
  $('search-results').innerHTML=searchVisible.length?searchVisible.map((item,index)=>`<button class="search-result" data-search="${index}"><span><span class="search-title">${esc(item.title)}</span><span class="search-sub">${esc(item.sub)}</span></span><span class="search-type">${esc(item.viewLabel)}</span></button>`).join(''):'<div class="empty">没有匹配项</div>';
}
function openSearch(){renderSearch();if(!$('search-dialog').open)$('search-dialog').showModal();$('search-input').focus()}
let toastTimer;
function toast(message){$('toast').textContent=message;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1500)}
async function copyText(text){
  try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text)}else{const area=document.createElement('textarea');area.value=text;area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();const ok=document.execCommand('copy');area.remove();if(!ok)throw new Error('copy')}toast('已复制：'+text)}catch(_){toast('复制失败，请手动复制')}
}
$('view-nav').addEventListener('click',event=>{const link=event.target.closest('[data-view]');if(!link)return;event.preventDefault();navigate(link.dataset.view)});
$('home-link').addEventListener('click',event=>{event.preventDefault();navigate(DATA.views[0].id)});
$('views').addEventListener('click',event=>{
  const timeline=event.target.closest('[data-timeline-index]');
  if(timeline){state.selected[state.view]=Number(timeline.dataset.timelineIndex);renderView();return}
  const filter=event.target.closest('[data-task-filter]');
  if(filter){state.taskFilter=filter.dataset.taskFilter;renderView();return}
  const copy=event.target.closest('[data-copy]');
  if(copy)copyText(copy.dataset.copy);
});
$('search-open').addEventListener('click',openSearch);
$('search-close').addEventListener('click',()=>$('search-dialog').close());
$('search-input').addEventListener('input',renderSearch);
$('search-results').addEventListener('click',event=>{
  const button=event.target.closest('[data-search]');if(!button)return;
  const item=searchVisible[Number(button.dataset.search)];$('search-dialog').close();state.taskFilter='all';navigate(item.viewId,item.index);
  requestAnimationFrame(()=>{const target=document.querySelector(`[data-key="${item.viewId}-${item.index}"]`);if(target){target.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});target.style.outline='2px solid var(--accent)';target.style.outlineOffset='3px';setTimeout(()=>{target.style.outline='';target.style.outlineOffset=''},1300)}});
});
$('search-dialog').addEventListener('click',event=>{if(event.target===$('search-dialog'))$('search-dialog').close()});
$('search-dialog').addEventListener('close',()=>{$('search-input').value=''});
$('theme-toggle').addEventListener('click',()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;try{localStorage.setItem('interactive-html-theme',next)}catch(_){}});
document.addEventListener('keydown',event=>{const editing=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName)||document.activeElement?.isContentEditable;if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='k'){event.preventDefault();openSearch()}else if(event.key==='/'&&!editing&&!$('search-dialog').open){event.preventDefault();openSearch()}});
window.addEventListener('hashchange',()=>{const [viewId,itemId]=location.hash.slice(1).split('/');const view=DATA.views.find(item=>item.id===viewId);if(!view)return;state.view=viewId;if(itemId){const index=view.items.findIndex(item=>item.id===itemId);if(index>=0)state.selected[viewId]=index}renderView()});
function init(){
  $('brand-name').textContent=meta.project;$('page-title').textContent=meta.title||meta.project+' · 交互观测台';$('page-description').textContent=meta.description||'项目数据交互式快照';
  $('page-eyebrow').textContent=meta.demo?'SYNTHETIC EXAMPLE / 合成示例':'PROJECT OBSERVATORY';
  $('snapshot').textContent=(meta.demo?'EXAMPLE · ': 'SNAPSHOT · ')+(meta.snapshot||'未注明日期');
  const rows=[['版本',meta.version],['基线',meta.baseline],['数据',meta.sourceLabel||'静态数据快照']].filter(([,value])=>value);
  $('side-meta').innerHTML='<div class="side-label">SNAPSHOT</div>'+rows.map(([label,value])=>`<div class="side-row"><span>${esc(label)}</span><strong>${esc(value)}</strong></div>`).join('');
  $('footer').innerHTML=`<span>${esc(meta.sourceLabel||'静态数据快照')}</span><span>单文件 HTML · 无外部依赖 · ${meta.demo?'合成示例':'不代表实时监控'}</span>`;
  const [viewId,itemId]=location.hash.slice(1).split('/');
  if(DATA.views.some(view=>view.id===viewId)){state.view=viewId;const view=DATA.views.find(view=>view.id===viewId);if(itemId){const index=view.items.findIndex(item=>item.id===itemId);if(index>=0)state.selected[viewId]=index}}
  renderSummary();renderView();
}
init();
</script>
</body>
</html>
