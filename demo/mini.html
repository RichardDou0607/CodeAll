<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AgentPet · 迷你条</title>
<style>
:root{--bg:#0b0e14;--line:#242c3a;--txt:#e6edf3;--dim:#8b98a9;--acc:#1f6feb}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;color:var(--txt);
  font:12px/1.4 -apple-system,"PingFang SC",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
#bar{height:100vh;display:flex;align-items:center;gap:7px;padding:0 9px;
  background:rgba(16,20,28,.97);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 14px 34px rgba(0,0,0,.5);cursor:default}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 8px currentColor}
#m-src{font-size:10px;color:#9db2cc;flex:0 0 auto;max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#m-main{flex:1;min-width:0;display:flex;align-items:baseline;gap:6px;overflow:hidden}
#m-title{font-size:12px;font-weight:600;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#m-sub{font-size:10.5px;color:var(--dim);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#m-state{font-size:11px;font-weight:600;flex:0 0 auto}
#m-tm{color:var(--dim);font-size:10px;flex:0 0 auto;width:34px;text-align:right}
#m-pend{color:#e3b341;font-size:10px;flex:0 0 auto}
button{background:#1d2531;color:var(--txt);border:1px solid var(--line);border-radius:7px;
  font-size:10px;padding:3px 6px;cursor:pointer;flex:0 0 auto;line-height:1.2}
button:hover{border-color:#3d4a60}
#m-cycle{min-width:34px;text-align:center}
</style>
</head>
<body>
<div id="bar" data-tauri-drag-region>
  <span class="dot" id="m-dot" style="background:#8b98a9;color:#8b98a9"></span>
  <span id="m-src" title="当前会话所属 agent 软件">—</span>
  <span id="m-main" data-tauri-drag-region>
    <span id="m-title">连接中…</span><span id="m-sub">…</span>
  </span>
  <span id="m-state">—</span>
  <span id="m-pend"></span>
  <span id="m-tm">--</span>
  <button id="m-cycle" title="轮换到下一个会话（其余会话隐藏，仅在此轮换）">⟳ 0</button>
  <button id="m-expand" title="展开 App 界面（查看全部会话 / 项目 / 投递）">⤢</button>
  <button id="m-pin" title="置顶迷你条">📌</button>
</div>
<script>
window.__PET_TOKEN__=window.__PET_TOKEN__||'__PET_TOKEN_VALUE__';
const STATE_LABEL={idle:'空闲',thinking:'思考中',running:'运行中',working:'工作中','transient-error':'出错',error:'错误',waiting:'等你',done:'完成'};
const COLOR={idle:'#8b98a9',thinking:'#4aa8ff',running:'#3fb950',working:'#3fb950','transient-error':'#e3b341',error:'#f85149',waiting:'#e3b341',done:'#bc8cff'};
// 动态机制的优先级：等你确认 > 出错 > 运行 > 思考 > 完成；同级按状态变更时间取最新
const RANK={waiting:0,'transient-error':1,error:2,running:3,working:3,thinking:4,done:5,idle:6};
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function mmss(ms){const s=Math.max(0,Math.floor(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function shortSrc(s){return String(s||'dsh').toUpperCase().replace('CLAUDE-CODE','CLAUDE').replace('KIMI-CODE','KIMI')}
function projNameOf(s,projList){
  const p=projList.find(x=>x.key===s.projectKey);
  return p?p.name:(s.cwd?String(s.cwd).split('/').pop():'');
}
async function trySetSize(w,h){
  try{
    const W=window.__TAURI__&&window.__TAURI__.window;
    if(W&&W.getCurrentWindow&&W.LogicalSize){await W.getCurrentWindow().setSize(new W.LogicalSize(w,h));return}
    if(window.__TAURI_INTERNALS__&&window.__TAURI_INTERNALS__.invoke){await window.__TAURI_INTERNALS__.invoke('plugin:window|set_size',{label:'main',size:{type:'Logical',width:w,height:h}})}
  }catch(e){}
}
async function showApp(){
  try{
    const T=window.__TAURI__;
    if(T&&T.window&&T.window.WebviewWindow&&T.window.WebviewWindow.getByLabel){const w=T.window.WebviewWindow.getByLabel('app');if(w){await w.show();await w.setFocus();return}}
    if(window.__TAURI_INTERNALS__&&window.__TAURI_INTERNALS__.invoke){
      await window.__TAURI_INTERNALS__.invoke('plugin:window|show',{label:'app'});
      await window.__TAURI_INTERNALS__.invoke('plugin:window|set_focus',{label:'app'});
      return;
    }
  }catch(e){}
  window.open('/window.html','agentpet-app');
}
// 拖拽：整条可拖（按钮除外）。外壳注入脚本的 .titlebar 机制对新版式不适用，
// 这里自己挂 mousedown → start_dragging（与外壳同一实现方式，远程源权限已放行）
(function wireDrag(){
  const el=$('bar');
  el.addEventListener('mousedown',ev=>{
    if(ev.button!==0)return;
    const t=ev.target;
    if(t&&t.closest&&t.closest('button,a,input,select,textarea'))return;
    try{
      const T=window.__TAURI__;
      if(T&&T.window&&T.window.getCurrentWindow){T.window.getCurrentWindow().startDragging();return}
    }catch(e){}
    try{
      const INT=window.__TAURI_INTERNALS__;
      if(INT&&INT.invoke){INT.invoke('plugin:window|start_dragging',{label:(INT.metadata&&INT.metadata.currentWindow&&INT.metadata.currentWindow.label)||'main'})}
    }catch(e){}
  });
})();
// 置顶（偏好持久化，与旧版行为一致）
(function wirePin(){
  const b=$('m-pin');
  function paint(on){b.style.opacity=on?'1':'.45';b.style.color=on?'#e3b341':'';b.title=on?'已置顶：悬浮在所有窗口之上（点击取消）':'置顶迷你条（默认关闭）'}
  let stored=false;
  try{stored=localStorage.getItem('agent-pet-pin')==='1'}catch(e){}
  paint(stored);
  const setTop=v=>{try{const T=window.__TAURI__;if(T&&T.window){T.window.getCurrentWindow().setAlwaysOnTop(v);return}}catch(e){}try{window.__TAURI_INTERNALS__.invoke('plugin:window|set_always_on_top',{label:'main',value:v})}catch(e){}};
  if(stored)setTop(true);
  b.addEventListener('click',ev=>{ev.stopPropagation();
    let on=false;try{on=!(localStorage.getItem('agent-pet-pin')==='1');localStorage.setItem('agent-pet-pin',on?'1':'0')}catch(e){on=true}
    paint(on);setTop(on);
  });
})();

// 动态选择：默认显示「优先级最高（等待/出错优先）→ 最新」的会话；
// 手动 ⟳ 轮换会锁定所选（其余隐藏），环回一圈后恢复自动；出现 waiting/error 紧急会话时自动抢占。
let lockSid=null;
function rankLive(live){return [...live].sort((a,b)=>(RANK[a.state]??9)-(RANK[b.state]??9)||(b.since??0)-(a.since??0))}
function pickSession(live){
  if(!live.length)return null;
  const ranked=rankLive(live);
  const urgent=ranked[0];
  if(urgent&&(urgent.state==='waiting'||urgent.state==='error'||urgent.state==='transient-error')){lockSid=null;return urgent}
  if(lockSid){const hit=live.find(s=>s.id===lockSid);if(hit)return hit}
  return ranked[0];
}
function render(snap){
  window.__SNAP__=snap;
  const projList=(snap.catalog&&snap.catalog.projects)||[];
  const live=(snap.sessions||[]).filter(s=>s.kind!=='subagent');
  if(lockSid&&!live.some(s=>s.id===lockSid))lockSid=null;
  const sel=pickSession(live);
  let state,act,tm,pend=0,col,src='—',title='全部空闲',sub='',tip='';
  if(sel){
    state=STATE_LABEL[sel.state]||sel.state;col=COLOR[sel.state]||'#8b98a9';
    src=shortSrc(sel.source);
    title=sel.label||sel.title||sel.id;
    const proj=projNameOf(sel,projList);
    sub='· '+proj+(sel.model?' · '+sel.model:'');
    tip=String(sel.cwd||'')||proj;
    tm=sel.state==='idle'?'--':sel.state==='done'?'完成':mmss(sel.elapsedMs||0);
    pend=sel.pending||0;
  }else{
    state=STATE_LABEL[snap.agg]||snap.agg;col=COLOR[snap.agg]||'#8b98a9';
    const c=snap.counters||{};
    title='无进行中会话';
    sub='· '+(projList.length?projList.length+' 个项目':'…')+(c.errors?' · 出错 '+c.errors:'');
    tm='--';
  }
  $('m-dot').style.background=col;$('m-dot').style.color=col;
  $('m-src').textContent=src;$('m-src').title='agent 软件：'+src;
  $('m-title').textContent=title;$('m-title').title=(tip?tip+'\n':'')+'点击 ⤢ 打开 App 查看全部 '+live.length+' 个会话';
  $('m-sub').textContent=sub;
  $('m-state').textContent=state;$('m-state').style.color=col;
  $('m-tm').textContent=tm;
  $('m-pend').textContent=pend?('⏳'+pend):'';
  const cyc=$('m-cycle');
  cyc.textContent='⟳ '+live.length;
  cyc.disabled=!live.length;
  cyc.title=live.length?('切换会话（'+(lockSid?'已锁定手动选择':'自动跟随最新')+'，共 '+live.length+' 个，其余隐藏）'):'无会话';
  window.__RENDER_OUT__={state:state,src:src,title:String(title).slice(0,18),tm:tm,pend:pend,live:live.length,locked:!!lockSid};
  return window.__RENDER_OUT__;
}
$('m-cycle').addEventListener('click',ev=>{ev.stopPropagation();
  const snap=window.__SNAP__;if(!snap)return;
  const live=(snap.sessions||[]).filter(s=>s.kind!=='subagent');
  if(!live.length)return;
  const ranked=rankLive(live);
  const cur=pickSession(live);
  const idx=Math.max(0,ranked.findIndex(s=>s.id===(cur&&cur.id)));
  const nxt=ranked[(idx+1)%ranked.length];
  lockSid=(nxt&&nxt.id===ranked[0].id&&idx===ranked.length-1)?null:(nxt?nxt.id:null);   // 环回一圈 → 恢复自动
  render(snap);
});
$('m-expand').addEventListener('click',ev=>{ev.stopPropagation();showApp()});
let es=null;
function connect(){
  es=new EventSource('/api/stream');
  es.onmessage=e=>{try{render(JSON.parse(e.data))}catch(err){}};
  es.onerror=function(){$('m-sub').textContent='· 与本地服务断开，重连中…';es.close();setTimeout(connect,3000)};
}
connect();
trySetSize(380,46);
</script>
</body>
</html>
