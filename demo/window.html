<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AgentPet · App</title>
<style>
:root{--bg:#0b0e14;--win:#12161f;--line:#242c3a;--txt:#e6edf3;--dim:#8b98a9;--idle:#8b98a9;--think:#4aa8ff;--run:#3fb950;--wait:#e3b341;--err:#f85149;--done:#bc8cff;--acc:#1f6feb}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b0e14;color:var(--txt);font:13px/1.5 -apple-system,"PingFang SC",system-ui,sans-serif;overflow:hidden}
#app{height:100vh;display:flex;flex-direction:column;background:linear-gradient(160deg,#141926,#0b0e14 60%)}
/* ---- 顶部：agent 软件切换 + 聚合状态 ---- */
header{flex:0 0 42px;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.02)}
header .logo{font-weight:700;font-size:13px;letter-spacing:.02em}
header .logo small{color:var(--dim);font-weight:400;font-size:10px;margin-left:4px}
#agent-tabs{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto}
#agent-tabs .tab{background:none;border:1px solid transparent;color:var(--dim);border-radius:8px;font-size:11px;padding:4px 10px;cursor:pointer;white-space:nowrap}
#agent-tabs .tab:hover{color:var(--txt);border-color:var(--line)}
#agent-tabs .tab.on{color:#fff;background:#1d2531;border-color:#34405499}
.aggchip{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;flex:0 0 auto}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 8px currentColor}
.chips{display:flex;gap:4px;flex:0 0 auto}
.chip{font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:1px 6px;white-space:nowrap}
.hbtn{background:#1d2531;color:var(--txt);border:1px solid var(--line);border-radius:8px;font-size:11px;padding:4px 9px;cursor:pointer;flex:0 0 auto}
/* ---- 主体：左项目 / 右会话 ---- */
#main{flex:1;display:flex;min-height:0}
aside{flex:0 0 188px;display:flex;flex-direction:column;border-right:1px solid var(--line);min-height:0}
.side-h{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:8px 12px 4px;font-size:10px;color:var(--dim);letter-spacing:.08em}
#projects{flex:1;overflow:auto;padding:2px 6px 6px}
.pitem{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:8px;cursor:pointer;color:#c3ceda;font-size:12px}
.pitem:hover{background:rgba(255,255,255,.04)}
.pitem.on{background:rgba(31,111,235,.16);box-shadow:inset 2px 0 0 var(--acc);color:#fff}
.pitem .pname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem .pcnt{flex:0 0 auto;font-size:10px;color:var(--dim)}
.pitem .plive{color:var(--run)}
#agents{flex:0 0 auto;max-height:132px;overflow:auto;border-top:1px solid var(--line);padding:2px 0}
.arow{display:flex;align-items:center;gap:7px;padding:4px 12px}
.arow .adot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 6px currentColor}
.arow .aname{flex:0 0 auto;font-size:11px;max-width:86px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .ameta{flex:1;min-width:0;color:var(--dim);font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .astate{flex:0 0 auto;font-size:10px}
.astate.connected{color:var(--run)} .astate.open-unconnected{color:var(--wait)} .astate.closed{color:var(--idle)} .astate.not-installed{color:#5a6676}
#content{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#toolbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.btn{background:#1d2531;color:var(--txt);border:1px solid var(--line);border-radius:8px;font-size:11px;padding:4px 9px;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
#toolbar .sp{flex:1}
#sessions{flex:1;overflow:auto;padding:4px 0}
.srow{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid rgba(36,44,58,.45);cursor:pointer}
.srow:hover{background:rgba(255,255,255,.03)}
.srow.sel{background:rgba(31,111,235,.14);box-shadow:inset 2px 0 0 var(--acc)}
.srow .src{width:64px;font-size:10px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 0 auto}
.srow .mid{flex:1;min-width:0}
.srow .lbl{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .meta{font-size:10.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .st{font-size:11px;flex:0 0 auto}
.srow .pend{font-size:10px;color:var(--wait);flex:0 0 auto}
.srow .tm{width:44px;text-align:right;color:var(--dim);font-size:10px;flex:0 0 auto}
.srow.hist .lbl{color:#c3ceda}
.empty{padding:18px 12px;color:var(--dim);font-size:12px;text-align:center}
/* ---- 底部：会话控制 ---- */
footer{flex:0 0 auto;border-top:1px solid var(--line);padding:8px 12px 6px;background:rgba(255,255,255,.015)}
.trow{font-size:10px;color:#9db2cc;margin-bottom:5px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow b{color:#e6edf3;font-weight:600}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;height:46px;resize:none;background:#0d1117;color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:8px 9px;font:12px/1.45 inherit;outline:none}
.composer textarea:focus{border-color:#3d4a60}
.crow{display:flex;align-items:center;gap:6px;margin-top:6px}
.crow .hint{flex:1;font-size:10px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.send{background:var(--acc);border:none;color:#fff;border-radius:8px;padding:6px 14px;font-size:12px;cursor:pointer}
.send:disabled{opacity:.5}
#queue{max-height:72px;overflow:auto;margin-top:6px;display:flex;flex-direction:column;gap:4px}
.qitem{display:flex;gap:6px;align-items:baseline;font-size:11px;color:var(--dim)}
.qitem .qt{flex:1;color:#a9b6c9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qitem .qs{flex:0 0 auto;font-size:10px;border:1px solid var(--line);border-radius:6px;padding:0 4px}
.qitem .qc{flex:0 0 auto;font-size:10px;color:#7f8ea3;cursor:pointer;text-decoration:underline}
.qs.queued{color:var(--wait)} .qs.failed{color:var(--err)}
.note{padding:5px 2px 0;font-size:10px;color:var(--dim)}
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="logo">AgentPet<small>总控</small></span>
    <nav id="agent-tabs"></nav>
    <span class="aggchip"><span class="dot" id="agg-dot"></span><span id="agg-text">连接中…</span></span>
    <span class="chips" id="chips"></span>
    <button class="hbtn" id="btn-mini" title="切换到迷你悬浮条（单行进度）">▤ 迷你条</button>
    <button class="hbtn" id="hide-win" title="隐藏窗口（⌘W 关闭）">✕</button>
  </header>
  <div id="main">
    <aside>
      <div class="side-h">项目（左侧切换）</div>
      <div id="projects"><div class="empty">读取中…</div></div>
      <div class="side-h">软件状态</div>
      <div id="agents"><div class="empty" style="padding:6px 12px">探测中…</div></div>
    </aside>
    <section id="content">
      <div id="toolbar">
        <button class="btn" id="toggle-history">历史会话</button>
        <button class="btn" id="new-session" disabled>＋ 新建会话</button>
        <span class="sp"></span>
        <span id="proj-hint" style="font-size:10px;color:var(--dim)"></span>
      </div>
      <div id="sessions"><div class="empty">正在读取会话状态…</div></div>
    </section>
  </div>
  <footer>
    <div class="trow" id="target" title="点击恢复自动选择">投递目标：自动 · 最近活跃主会话（点击会话行可指定）</div>
    <div class="composer">
      <textarea id="input" placeholder="给选中会话发消息…（Enter 发送 / Shift+Enter 换行）"></textarea>
      <button class="send" id="send">发送</button>
    </div>
    <div class="crow"><span class="hint" id="hint">未连接</span><span class="chip" title="窗口失焦时按 ⌥⌘I 直接聚焦输入框">⌥⌘I 聚焦</span></div>
    <div id="queue"></div>
    <div class="note" id="note">数据只读自本机会话日志；输入经所选后端的官方通道送达。</div>
  </footer>
</div>
<script>
window.__PET_TOKEN__=window.__PET_TOKEN__||'__PET_TOKEN_VALUE__';
const STATE_LABEL={idle:'空闲',thinking:'思考中',running:'运行中',working:'工作中','transient-error':'出错（自动恢复）',error:'连接错误',waiting:'等待你',done:'已完成'};
const COLOR={idle:'#8b98a9',thinking:'#4aa8ff',running:'#3fb950',working:'#3fb950','transient-error':'#e3b341',error:'#f85149',waiting:'#e3b341',done:'#bc8cff'};
const AGENT_STATUS_LABEL={connected:'已连接','open-unconnected':'已打开 · 未连接',closed:'未打开','not-installed':'未下载'};
const AGENT_STATUS_COLOR={connected:'#3fb950','open-unconnected':'#e3b341',closed:'#8b98a9','not-installed':'#5a6676'};
const AGENT_TABS=[['','全部'],['dsh','DSH'],['claude-code','CLAUDE'],['codex','CODEX'],['kimi-code','KIMI']];
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"'`]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'}[c]))}
function mmss(ms){const s=Math.max(0,Math.floor(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function relTime(ms,now){if(!ms)return '';const s=Math.max(0,Math.floor((now-ms)/1000));if(s<60)return s+' 秒前';if(s<3600)return Math.floor(s/60)+' 分钟前';if(s<86400)return Math.floor(s/3600)+' 小时前';return Math.floor(s/86400)+' 天前'}
function metaLine(s){const p=[];if(s.agentName)p.push(s.agentName);if(s.model)p.push(s.model);if(s.reasoningEffort)p.push('th:'+s.reasoningEffort);return p.join(' · ')}
async function trySetSize(w,h){
  try{
    const W=window.__TAURI__&&window.__TAURI__.window;
    if(W&&W.getCurrentWindow&&W.LogicalSize){await W.getCurrentWindow().setSize(new W.LogicalSize(w,h));return}
    if(window.__TAURI_INTERNALS__&&window.__TAURI_INTERNALS__.invoke){await window.__TAURI_INTERNALS__.invoke('plugin:window|set_size',{size:{type:'Logical',width:w,height:h}})}
  }catch(e){}
}
function projNameOf(s,projList){
  if(!s)return '';
  const k=s.projectKey;
  const p=projList.find(x=>x.key===k);
  return p?p.name:(s.cwd?String(s.cwd).split('/').pop():'');
}
function render(snap){
  window.__SNAP__=snap;
  const now=snap.ts||Date.now();
  // ---- 顶部：agent tabs + 聚合 ----
  const tabsEl=$('agent-tabs');
  const tabsHtml=AGENT_TABS.map(([v,l])=>'<button class="tab'+((window.__AGENT__||'')===v?' on':'')+'" data-agent="'+v+'">'+l+'</button>').join('');
  if(tabsEl.__petLastHtml!==tabsHtml){tabsEl.innerHTML=tabsHtml;tabsEl.__petLastHtml=tabsHtml}
  const agg=snap.agg||'idle';
  $('agg-dot').style.background=COLOR[agg]||'#8b98a9';$('agg-dot').style.color=COLOR[agg]||'#8b98a9';
  $('agg-text').textContent=STATE_LABEL[agg]||agg;$('agg-text').style.color=COLOR[agg]||'#8b98a9';
  const c=snap.counters||{};
  $('chips').innerHTML=[['思考中',c.thinking],['运行',c.running],['出错',c.errors],['完成',c.done]].map(kv=>kv[1]?'<span class="chip">'+kv[0]+' '+kv[1]+'</span>':'').join('');
  // ---- 过滤口径：agent tab（顶部）+ 项目（左侧）----
  const agentSel=window.__AGENT__||'';
  const projListAll=(snap.catalog&&snap.catalog.projects)||[];
  const projList=agentSel?projListAll.filter(p=>(p.sources||[]).indexOf(agentSel)>=0):projListAll;
  const pid=window.__PROJECT__||'';
  const curProj=projList.filter(p=>p.key===pid)[0];
  if(pid&&projListAll.length&&!curProj){window.__PROJECT__=''}   // 当前 agent 下无此项目 → 回「全部」
  const inProj=(s)=>!curProj?true:(s.projectKey!==undefined?s.projectKey===curProj.key:(s.cwd?curProj.cwd===s.cwd:false));
  // ---- 左侧：项目 ----
  const projHtml='<div class="pitem'+(pid?'':' on')+'" data-proj="">全部项目<span class="pcnt">'+projList.length+'</span></div>'
    +projList.map(p=>'<div class="pitem'+(p.key===pid?' on':'')+'" data-proj="'+esc(p.key)+'" title="'+esc(p.cwd||'')+'"><span class="pname">'+esc(p.name)+'</span><span class="pcnt">'+(p.liveCount?'<span class="plive">'+p.liveCount+' 进行</span> · ':'')+p.sessionCount+'</span></div>').join('');
  const projEl=$('projects');
  if(projEl.__petLastHtml!==projHtml){projEl.innerHTML=projHtml;projEl.__petLastHtml=projHtml}
  // ---- 左侧：软件四态 ----
  const agentsEl=$('agents');
  const agentsList=(snap.agents||[]);
  let ahtml='';
  if(!agentsList.length)ahtml='<div class="empty" style="padding:6px 12px">正在探测本机 agent 软件…</div>';
  else ahtml=agentsList.map(a=>{
    const st=a.status||'closed',col=AGENT_STATUS_COLOR[st]||'#8b98a9';
    const meta=[];
    if(a.version)meta.push('v'+a.version);
    if(st==='connected')meta.push(a.connectionKind==='plugin'?'插件通道':a.connectionKind==='event'?'事件流':'日志通道');
    if(a.running&&a.processes>1)meta.push(a.processes+' 进程');
    if(a.id==='kimi-code'&&a.sessionCount!=null)meta.push((a.sessionCountApproximate?'≈':'')+a.sessionCount+' 会话');
    if(st==='closed'&&a.lastActivityMs)meta.push('上次活动 '+relTime(a.lastActivityMs,now));
    if(st==='open-unconnected'&&a.note)meta.push(a.note);
    if(st==='not-installed')meta.push('未检测到安装痕迹');
    return '<div class="arow" data-agent="'+esc(a.id)+'" title="'+esc((a.evidence||[]).join('\n')+(a.note?'\n'+a.note:''))+'">'
      +'<span class="adot" style="background:'+col+';color:'+col+'"></span>'
      +'<span class="aname">'+esc(a.name)+'</span><span class="ameta">'+esc(meta.join(' · '))+'</span>'
      +'<span class="astate '+st+'" style="color:'+col+'">'+(AGENT_STATUS_LABEL[st]||st)+'</span></div>';
  }).join('');
  if(agentsEl.__petLastHtml!==ahtml){agentsEl.innerHTML=ahtml;agentsEl.__petLastHtml=ahtml}
  // ---- 会话列表（实时 + 历史）----
  const rows=(snap.sessions||[]).filter(s=>(!agentSel||s.source===agentSel)&&s.kind!=='subagent'&&inProj(s));
  const showHist=window.__SHOW_HISTORY__===true;
  const histAll=((snap.catalog&&snap.catalog.history)||[])
    .filter(s=>(!agentSel||s.source===agentSel)&&s.kind!=='subagent'&&inProj(s));
  const liveIds=new Set(rows.map(s=>s.id));
  const hist=histAll.filter(s=>!liveIds.has(s.sessionId)&&!s.live).slice(0,30);
  const tgt=window.__TARGET__||'';
  let tgtHit=null;
  for(const s of rows.concat(hist)){if(s.id===tgt||s.sessionId===tgt){tgtHit=s;break}}
  if(tgt&&!tgtHit)window.__TARGET__='';
  let html='';
  if(rows.length){
    html+=rows.map(s=>{
      const st=s.state,col=COLOR[st]||'#8b98a9';
      const sel=window.__TARGET__===s.id;
      const proj=curProj?'':' · '+esc(projNameOf(s,projListAll));
      return '<div class="srow'+(sel?' sel':'')+'" data-session="'+esc(s.id)+'" title="点击选为投递目标"><span class="dot" style="background:'+col+';color:'+col+'"></span><span class="src">'+esc(String(s.source||'dsh').toUpperCase())+'</span>'
        +'<span class="mid"><span class="lbl">'+esc(s.label||s.title||s.id)+'</span><span class="meta">'+esc(metaLine(s))+proj+'</span></span>'
        +'<span class="st" style="color:'+col+'">'+(STATE_LABEL[st]||st)+'</span>'
        +(s.pending?'<span class="pend">待办 '+s.pending+'</span>':'')
        +'<span class="tm">'+(st==='idle'?'--':st==='done'?'完成':mmss(s.elapsedMs||0))+'</span></div>';
    }).join('');
  }else{
    html+='<div class="empty">暂无实时会话（等待后端活动：DSH / Claude Code / Codex / Kimi Code…）</div>';
  }
  if(showHist||curProj){
    html+=hist.length?hist.map(s=>{
      const col=COLOR[s.state]||'#8b98a9';
      const sel=window.__TARGET__===s.sessionId;
      const proj=curProj?'':' · '+esc(projNameOf(s,projListAll));
      return '<div class="srow hist'+(sel?' sel':'')+'" data-session="'+esc(s.sessionId)+'" title="点击选为投递目标并打开"><span class="dot" style="background:'+col+';color:'+col+'"></span><span class="src">'+esc(String(s.source||'dsh').toUpperCase())+'</span>'
        +'<span class="mid"><span class="lbl">'+esc(s.title||String(s.sessionId).slice(0,12))+'</span><span class="meta">'+esc(metaLine(s))+proj+' · '+new Date(s.updatedAt).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})+'</span></span>'
        +'<span class="st" style="color:'+col+'">'+(STATE_LABEL[s.state]||s.state)+'</span><span class="tm">打开</span></div>';
    }).join(''):'<div class="empty">没有历史会话</div>';
  }
  const sessEl=$('sessions');
  if(sessEl.__petLastHtml!==html){sessEl.innerHTML=html;sessEl.__petLastHtml=html}
  $('proj-hint').textContent=(agentSel?('仅 '+agentSel.toUpperCase()+' · '):'')+(curProj?curProj.name:'全部项目')+' · 实时 '+rows.length+' / 历史 '+hist.length;
  // ---- 投递目标行 ----
  const tgtEl=$('target');
  if(window.__TARGET__){
    const src=tgtHit?(tgtHit.source||'dsh'):'dsh';
    const label=esc((tgtHit&&(tgtHit.label||tgtHit.title))||String(window.__TARGET__).slice(0,12));
    tgtEl.innerHTML=src!=='dsh'
      ?('投递目标：<b>'+label+'</b> · 经 '+esc(src.toUpperCase())+' CLI 投递（点击恢复自动）')
      :('投递目标：<b>'+label+'</b>（点击恢复自动）');
  }else{
    tgtEl.innerHTML='投递目标：自动 · 最近活跃主会话（点击会话行可指定）';
  }
  // ---- 底部：能力位 / hint / 队列（只留未完成：delivered 不再显示） ----
  const caps=snap.capabilities||{};
  $('new-session').disabled=!caps.canCreate;
  $('new-session').title=caps.canCreate?'在当前筛选下新建会话（DSH=插件；其余=终端新窗口）':'新建通道不可用（DSH 需插件；CLI 后端需在 PATH）';
  const ch=snap.inputChannel||{};
  $('hint').textContent=ch.mode==='cmd'?('自动投递：'+ch.detail):ch.mode==='cli'?('DSH 进本地队列 · Claude/Codex/Kimi 直接 CLI 投递'):'输入进本地队列 · 可复制投递';
  const qs=(snap.inputs||[]).filter(i=>i.status&&i.status!=='delivered');
  $('queue').innerHTML=qs.map(i=>{
    const label={queued:'待投递',pending:'投递中',failed:'失败'}[i.status]||i.status;
    return '<div class="qitem"><span class="qs '+(i.status||'queued')+'">'+label+'</span><span class="qt">'+esc(i.text)+'</span>'
      +'<span class="qc" data-copy="'+esc(i.text)+'">复制</span>'
      +((i.status==='queued'||i.status==='failed')?'<span class="qc" data-resend="'+esc(i.id)+'">重发</span>':'')
      +'<span class="qc" data-del="'+esc(i.id)+'">✕</span></div>';
  }).join('');
  const last=snap.lastEvent;
  $('note').textContent='只读会话日志 · '+(projList.length?('项目 '+projList.length+' · 会话 '+(projList.reduce((a,p)=>a+p.sessionCount,0))+' · 扫描 '+(snap.catalog&&snap.catalog.elapsedMs||0)+'ms'):'目录扫描中')+' · 最后事件 '+(last?last.type:'—');
  window.__RENDER_OUT__={agg:agg,agent:agentSel,rows:rows.length,hist:hist.length,projects:projList.length,queueShown:qs.length,targetShown:!!window.__TARGET__};
  return window.__RENDER_OUT__;
}
async function api(path,payload,method){
  const opt={method:method||'POST',headers:{'content-type':'application/json','x-pet-token':window.__PET_TOKEN__||''}};
  if(payload!==undefined)opt.body=JSON.stringify(payload);
  const res=await fetch(path,opt);
  return await res.json();
}
async function send(){
  const el=$('input');const text=el.value.trim();if(!text)return;
  el.value='';$('send').disabled=true;
  try{
    const j=await api('/api/input',{text:text,sessionId:window.__TARGET__||undefined});
    if(j.ok===false&&j.item){$('note').textContent={queued:'已入本地队列（未配置投递通道）',failed:'投递失败：'+(j.item.detail||j.item.status)}[j.item.status]||('发送状态：'+j.item.status)}
    else if(j.ok===false){$('note').textContent='被本地服务拒绝：'+((j.detail&&String(j.detail))||j.error||'未知')}
    else if(j.ok===true){$('note').textContent='已送达 ✓ '+(j.item&&j.item.detail?j.item.detail.slice(0,60):'')}   // 成功的消息不进队列展示，只在这里闪一次确认
  }catch(e){el.value=text;$('note').textContent='发送失败（输入已恢复）：'+e.message}
  $('send').disabled=false;$('input').focus();
}
async function openSession(id){
  try{
    const j=await api('/api/open',{sessionId:id});
    $('note').textContent=j.ok?('已打开/定位会话 · '+(j.via||j.reason||'')):('打开失败：'+(j.detail||j.reason||'未知'));
  }catch(e){$('note').textContent='打开失败：'+e.message}
}
$('send').onclick=send;
$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
$('agent-tabs').addEventListener('click',e=>{const t=e.target.closest('[data-agent]');if(!t)return;window.__AGENT__=t.getAttribute('data-agent');if(window.__SNAP__)render(window.__SNAP__)});
$('projects').addEventListener('click',e=>{const t=e.target.closest('[data-proj]');if(!t)return;window.__PROJECT__=t.getAttribute('data-proj')||'';if(window.__SNAP__)render(window.__SNAP__)});
$('toggle-history').onclick=function(){window.__SHOW_HISTORY__=!window.__SHOW_HISTORY__;if(window.__SNAP__)render(window.__SNAP__)};
// 新建会话：agent tab 指定了后端就用它；否则按项目来源挑（DSH 插件优先，其次 CLI）
$('new-session').onclick=async function(){
  const snap=window.__SNAP__||{};
  const projList=(snap.catalog&&snap.catalog.projects)||[];
  const caps=snap.capabilities||{};
  const cliSrc=(caps.cliChannels||[]).map(x=>x.source);
  const p=projList.find(x=>x.key===(window.__PROJECT__||''));
  let src=window.__AGENT__||'';
  if(!src&&p&&p.sources){src=(p.sources.indexOf('dsh')>=0&&caps.plugin&&caps.plugin.available)?'dsh':['claude-code','codex','kimi-code'].filter(s=>p.sources.indexOf(s)>=0&&cliSrc.indexOf(s)>=0)[0]||(cliSrc[0]||'dsh')}
  if(!src)src='dsh';
  const j=await api('/api/new',{cwd:p?p.cwd:'',source:src});
  $('note').textContent='新建会话（'+String(src).toUpperCase()+'）：'+(j.ok?(j.via||'已创建')+'；目录将在几秒内出现':((j.detail&&String(j.detail).slice(0,90))||(j.reason&&String(j.reason).slice(0,90))||j.error||'未知'));
  try{await api('/api/catalog?refresh=1',undefined,'GET')}catch(err){}
};
// 会话行点击 = 选为投递目标（再点一次取消）；历史行同时打开
$('sessions').addEventListener('click',e=>{
  const t=e.target.closest('[data-session]');
  if(!t)return;
  const id=t.getAttribute('data-session');
  window.__TARGET__=(window.__TARGET__===id)?'':id;
  if(t.classList&&t.classList.contains('hist'))openSession(id);
  if(window.__SNAP__)render(window.__SNAP__);
  $('input').focus();
});
$('target').onclick=function(){window.__TARGET__='';if(window.__SNAP__)render(window.__SNAP__)};
// 队列操作（只对未完成项：复制/重发/删除）
$('queue').addEventListener('click',async e=>{
  const c=e.target.closest('[data-copy]');
  if(c){const txt=c.getAttribute('data-copy');if(navigator.clipboard)navigator.clipboard.writeText(txt);$('note').textContent='已复制到剪贴板：'+txt.slice(0,40);return}
  const del=e.target.closest('[data-del]');
  if(del){try{await api('/api/input/'+encodeURIComponent(del.getAttribute('data-del')),undefined,'DELETE')}catch(err){}return}
  const rs=e.target.closest('[data-resend]');
  if(rs){const id=rs.getAttribute('data-resend');try{const j=await api('/api/input/'+encodeURIComponent(id)+'/resend',{});$('note').textContent=j.ok?'重发已送达 ✓':'重发未送达：'+((j.item&&(j.item.detail||j.item.status))||'')}catch(err){$('note').textContent='重发失败：'+err.message}return}
});
$('btn-mini').onclick=async function(){try{await trySetSize(360,64)}catch(e){};location.href='/mini.html'};
$('hide-win').onclick=async function(){
  try{
    if(window.__TAURI__&&window.__TAURI__.window){await window.__TAURI__.window.getCurrentWindow().hide();return}
    if(window.__TAURI_INTERNALS__&&window.__TAURI_INTERNALS__.invoke){await window.__TAURI_INTERNALS__.invoke('plugin:window|hide');return}
  }catch(e){}
  $('note').textContent='浏览器演示无法隐藏窗口；Tauri 外壳里此按钮会隐藏窗口';
};
document.addEventListener('keydown',e=>{if(e.altKey&&e.metaKey&&e.key.toLowerCase()==='i'){e.preventDefault();$('input').focus()}});
let es=null;
function connect(){
  es=new EventSource('/api/stream');
  es.onmessage=e=>{try{render(JSON.parse(e.data))}catch(err){}};
  es.onerror=function(){$('hint').textContent='与本地服务断开，3s 后重连…';es.close();setTimeout(connect,3000)};
}
connect();
trySetSize(980,640);
</script>
</body>
</html>
