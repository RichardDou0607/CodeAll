[package]
name = "agent-pet-shell"
version = "0.1.4"
description = "Agent 悬浮窗桌面外壳（Tauri v2）"
authors = ["agent-pet"]
edition = "2021"

[lib]
name = "agent_pet_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 拖拽：WKWebView 内容页无法使用 data-tauri-drag-region（远程源不注入 IPC），
# 因此走 macOS 原生 NSWindow.isMovableByWindowBackground。
[target.'cfg(unix)'.dependencies]
# 只用来装 SIGTERM/SIGINT 处理器：被 kill 时也要收掉自己拉起的本地服务
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
